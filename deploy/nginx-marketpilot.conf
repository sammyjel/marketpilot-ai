# Reverse proxy for MarketPilot. nginx is already installed on this box for the
# radio's media directory; this adds a second server block and leaves that one
# untouched.
#
# Install:
#   cp deploy/nginx-marketpilot.conf /etc/nginx/sites-available/marketpilot
#   sed -i 's/APP_DOMAIN/your.domain/g' /etc/nginx/sites-available/marketpilot
#   ln -sf /etc/nginx/sites-available/marketpilot /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d your.domain        # rewrites this file to add TLS
#
# NOTE: `systemctl enable --now nginx` does not reload config when apt already
# started it. Use `systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN;

    # Product photos and generated media are uploaded through Server Actions.
    client_max_body_size 30m;

    # The internal queue-drain endpoint is not needed once a real worker process
    # runs on this box, and nothing outside should ever reach it.
    location /api/internal/ {
        return 404;
    }

    # Media that Instagram's and Pinterest's servers fetch for themselves.
    #
    # Served at /uploads/, not /media/: the application already owns a /media
    # page and /api/media/* routes, and an alias on /media/ shadows them.
    #
    # Those APIs take a URL, not bytes, so the file has to be reachable without
    # a session. Access control is the key itself: 24 random hex characters
    # produced by `LocalStorageProvider.keyFor`, unguessable and never listed.
    # Everything reachable here is media the user is about to publish publicly
    # anyway. Authenticated access keeps using /api/media/file instead.
    location /uploads/ {
        alias /opt/marketpilot/storage/;
        autoindex off;

        # `put` writes a .meta sidecar next to every object. It is internal
        # bookkeeping, not media, so it must not be downloadable.
        location ~ \.meta$ { return 404; }

        # Never let an upload be served as something the browser will run.
        types { } default_type application/octet-stream;
        include /etc/nginx/mime.types;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; sandbox";

        expires 7d;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        # Content-hashed filenames: safe to cache hard.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # A six-stage campaign generation runs in the worker, but a Server
        # Action that waits on one still needs more than the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
