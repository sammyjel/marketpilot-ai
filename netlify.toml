# Netlify build and runtime configuration.
#
# The Next.js runtime is installed automatically for Next sites, so it is not
# declared here. Server Actions, route handlers and middleware all run as Node
# functions; nothing in this app is edge-only.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # package.json requires >= 20.11. Pinned so a Netlify default change cannot
  # move the runtime underneath a working deploy.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[context.production]
  # Migrations run once, here, before the new code is published. Only the
  # production context is pointed at the real database, so it is the only
  # context that applies DDL. Scope DATABASE_URL to production in the Netlify
  # UI (or give previews their own branch database) to keep that true.
  #
  # With no DATABASE_URL the migration is skipped rather than failing the
  # build: the site still deploys and serves the pages that do not touch the
  # database, which is what makes a design deploy possible before the database
  # exists. The build log says plainly that it was skipped.
  command = "if [ -n \"$DATABASE_URL\" ]; then npm run db:migrate; else echo 'DATABASE_URL is not set - skipping migrations. Pages that read the database will fail until it is.'; fi && npm run build"

# The queue drain endpoint is internal: it is called by the scheduled function
# using a bearer secret and must never be reachable from a browser or indexed.
[[headers]]
  for = "/api/internal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
